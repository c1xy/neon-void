let RSTATE = (Math.random() * 4294967296) >>> 0;

// 把一局构筑（卡牌等级）/波次/得分/擦弹数打包成 base64url 悬赏码，写入 location.hash。
// v3 布局（24 字节）：[ver=3, 14×卡等级, 波次u16, 得分u24, 擦弹u16, 击杀链u8, XOR校验] → 32 字符
// v2（22 字节，12 张卡）/ v1（19 字节，9 张卡）仍可解析（旧悬赏链接不失效），缺省卡等级视为 0；新码一律发 v3。
const B64U = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
const BOUNTY_VER = 3;
const BOUNTY_LEGACY = { 1: 9, 2: 12 }; // 旧版本号 → 当时卡数（v1 九张卡 / v2 十二张卡）
// 14 张卡 → 10 种弹幕模式（radial/spread/spiral/aimed/wall/blink/charge/nova + 双螺旋/镜面折返）
const GHOST_MAP = ['aimed', 'spiral', 'spread', 'charge', 'wall', 'radial', 'blink', 'spiral', 'wall', 'mirror', 'dspin', 'wall', 'nova', 'radial'];
function b64uEnc(bytes) {
  let out = '';
  let i = 0;
  for (; i + 2 < bytes.length; i += 3) {
    const n = (bytes[i] << 16) | (bytes[i + 1] << 8) | bytes[i + 2];
    out += B64U[(n >>> 18) & 63] + B64U[(n >>> 12) & 63] + B64U[(n >>> 6) & 63] + B64U[n & 63];
  }
  const rem = bytes.length - i;
  if (rem === 1) {
    const n = bytes[i] << 16;
    out += B64U[(n >>> 18) & 63] + B64U[(n >>> 12) & 63];
  } else if (rem === 2) {
    const n = (bytes[i] << 16) | (bytes[i + 1] << 8);
    out += B64U[(n >>> 18) & 63] + B64U[(n >>> 12) & 63] + B64U[(n >>> 6) & 63];
  }
  return out;
}
function b64uDec(s) {
  s = String(s || '').replace(/=+$/, '').replace(/\+/g, '-').replace(/\//g, '_');
  if (!s.length || s.length > 64) return null;
  const out = [];
  let buf = 0, bits = 0;
  for (let i = 0; i < s.length; i++) {
    const v = B64U.indexOf(s[i]);
    if (v < 0) return null;
    buf = ((buf << 6) | v) & 0xFFFFFF;
    bits += 6;
    if (bits >= 8) { bits -= 8; out.push((buf >>> bits) & 255); }
  }

}
function bountyPack(d) {
  const NC = UPGRADES.length;
  const b = new Array(1 + NC + 9).fill(0); // ver + 卡等级 + 波次2 + 得分3 + 擦弹2 + 链1 + 校验1
  b[0] = BOUNTY_VER;
  for (let i = 0; i < NC; i++) {
    const u = UPGRADES[i];
    b[1 + i] = CL(Math.min(d.lv[i] || 0, u ? u.max : 7), 0, 7);
  }
  const o = 1 + NC;
  const w = CL(Math.floor(d.wave || 0), 0, 65535);

  b[o + 2] = (s >> 16) & 255; b[o + 3] = (s >> 8) & 255; b[o + 4] = s & 255;

}
function bountyUnpack(code) {
  const b = b64uDec(code);
  if (!b) return null;
  const NC = UPGRADES.length;
  // v3：当前卡数；v2/v1：历史卡数（BOUNTY_LEGACY 表），旧码缺省的新卡等级视为 0
  let n = 0;
  if (b[0] === BOUNTY_VER && b.length === 1 + NC + 9) n = NC;
  else if (BOUNTY_LEGACY[b[0]] && b.length === 1 + BOUNTY_LEGACY[b[0]] + 9) n = BOUNTY_LEGACY[b[0]];
  else return null;
  let x = 0;
  for (let i = 0; i < b.length - 1; i++) x ^= b[i];
  if (x !== b[b.length - 1]) return null;
  const lv = [];
  for (let i = 0; i < NC; i++) {
    const u = UPGRADES[i];
    lv.push(i < n ? CL(b[1 + i], 0, u ? Math.min(7, u.max) : 7) : 0);
  }
  const o = 1 + n;
  return {
    lv, wave: (b[o] << 8) | b[o + 1],
    score: (b[o + 2] << 16) | (b[o + 3] << 8) | b[o + 4],
    grazes: (b[o + 5] << 8) | b[o + 6],
    chain: Math.min(250, b[o + 7])

}
function bountyFromRun() {

function updPlayer(dt) {
  let ix = 0, iy = 0;
  const vsBoss = G.mode === 'versus' || G.mode === 'ghost';
  if (keys.has('KeyA') || (!G.coop && !vsBoss && keys.has('ArrowLeft'))) ix--;

  if (keys.has('KeyS') || (!G.coop && !vsBoss && keys.has('ArrowDown'))) iy++;
  const il = Math.sqrt(ix * ix + iy * iy) || 1;
  ix /= il; iy /= il;
  player.ix = ix; player.iy = iy;
  if (joy.id !== null) {
    const jl = Math.sqrt(joy.dx * joy.dx + joy.dy * joy.dy);
    if (jl > 12) { ix = joy.dx / jl; iy = joy.dy / jl; }
    else { ix = 0; iy = 0; }
    player.ix = ix; player.iy = iy;
  }
  if (player.dashT > 0) {
    player.dashT -= dt;
    player.vx = Math.cos(player.dashA) * 1250;
    player.vy = Math.sin(player.dashA) * 1250;
    ghosts.push({ x: player.x, y: player.y, a: player.a, life: 0.32, c: PAL1.ghost });
    if (ghosts.length > 30) ghosts.shift();
  } else {
    const msp = 430 * G.spdMul * (G.odT > 0 ? 1.1 : 1);
    const k = 1 - Math.exp(-10 * dt);
    player.vx = LP(player.vx, ix * msp, k);
    player.vy = LP(player.vy, iy * msp, k);
  }
  player.x = CL(player.x + player.vx * dt, 16, W - 16);
  player.y = CL(player.y + player.vy * dt, 16, H - 16);
  const spdNow = Math.sqrt(player.vx * player.vx + player.vy * player.vy);
  gridPush(player.x, player.y, 85, spdNow * (player.dashT > 0 ? 5 : 1.2), dt);
  player.dashCd = Math.max(0, player.dashCd - dt);
  player.inv = Math.max(0, player.inv - dt);
  player.spawnT = Math.max(0, player.spawnT - dt);
  if (G.touchMode || G.time - G.lastMouse > 2.5) {
    let best = null, bd = 1e12;
    for (const en of enemies) { const dd = D2(en.x, en.y, player.x, player.y); if (dd < bd) { bd = dd; best = en; } }
    if (G.boss && G.boss.dying == null && G.boss.st !== 'enter') {
      const dd = D2(G.boss.x, G.boss.y, player.x, player.y);
      if (dd < bd) { bd = dd; best = G.boss; }
    }
    if (best) player.a = Math.atan2(best.y - player.y, best.x - player.x);
  } else {
    player.a = Math.atan2(mouse.y - player.y, mouse.x - player.x);
  }
  // [FIX-10] 与 P2 保持一致：补上 rateMul（超频射控）与超载 ×2，否则该升级对单人完全无效
  // 擦弹专精：开火被永久封印（fireT 持续压着），得分/充能全部来自贴身擦弹
  const rate = (G.rapid > 0 ? 12.5 : 6.5) * G.rateMul * (G.odT > 0 ? 2 : 1) * (hasMut('big') && !evo('big') ? 0.75 : 1);
  player.fireT -= dt;
  if (player.fireT <= 0) {
    if (G.mode === 'graze') player.fireT = 0.2;
    else { player.fireT = 1 / rate; fireBullet(player); }
  }
  const spd = Math.sqrt(player.vx * player.vx + player.vy * player.vy);
  if (spd > 60 && Math.random() < 0.8 * PF()) {
    const ba = Math.atan2(player.vy, player.vx) + Math.PI + R(-0.3, 0.3);
    parts.push({ type: 0, x: player.x + Math.cos(ba) * 13, y: player.y + Math.sin(ba) * 13,
      vx: Math.cos(ba) * R(30, 90), vy: Math.sin(ba) * R(30, 90), life: R(0.15, 0.3), ml: 0.3,
      c: Math.random() < 0.5 ? '#3ddfff' : '#ffaa55', sz: R(1.2, 2.2), drag: 2 });
  }
}

function updEnemies(dt) {
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    const dx = player.x - e.x, dy = player.y - e.y;
    const d = Math.sqrt(dx * dx + dy * dy) || 1;
    const ux = dx / d, uy = dy / d;
    e.hitT = Math.max(0, e.hitT - dt);
    e.ph += dt;
    e.age += dt;
    const k = 1 - Math.exp(-3.2 * dt);
    // 擦弹专精：掠过计时结束 → 转入撤离（直线冲出屏幕，途中仍有碰撞伤害），出界即移除
    if (e.grzLeave != null && !e.flee) {
      e.grzLeave -= dt;
      if (e.grzLeave <= 0) {
        e.flee = true;
        e.fleA = Math.atan2(e.y - player.y, e.x - player.x) + RG(-0.5, 0.5);
        e.fireT = 99; // 停火
        addText(e.x, e.y - e.r - 8, '撤离', e.c, 10);
      }
    }
    if (e.flee) {
      const fs = e.sp * 1.7 + 90;
      const fk = 1 - Math.exp(-4 * dt);
      e.vx = LP(e.vx, Math.cos(e.fleA) * fs, fk);
      e.vy = LP(e.vy, Math.sin(e.fleA) * fs, fk);
      e.rot = Math.atan2(e.vy, e.vx);
    } else if (e.t === 'chaser' || e.t === 'mini') {
      e.vx = LP(e.vx, ux * e.sp, k); e.vy = LP(e.vy, uy * e.sp, k);
      e.rot = Math.atan2(e.vy, e.vx);
    } else if (e.t === 'weaver') {
      const s = Math.sin(e.ph * 4);
      let tx = ux - uy * s, ty = uy + ux * s;
      const tl = Math.sqrt(tx * tx + ty * ty) || 1;
      e.vx = LP(e.vx, tx / tl * e.sp, k); e.vy = LP(e.vy, ty / tl * e.sp, k);
      e.rot += 3.4 * dt;
    } else if (e.t === 'tank') {
      e.vx = LP(e.vx, ux * e.sp, k); e.vy = LP(e.vy, uy * e.sp, k);
      e.rot += 0.8 * dt;
    } else if (e.t === 'sniper') {
      let tx, ty;
      if (d > 300) { tx = ux; ty = uy; }
      else if (d < 200) { tx = -ux; ty = -uy; }
      else { tx = -uy * e.dir; ty = ux * e.dir; }
      e.vx = LP(e.vx, tx * e.sp, k); e.vy = LP(e.vy, ty * e.sp, k);
      e.rot += 1.2 * dt;
      e.fireT -= dt;
      if (e.fireT <= 0 && d < 560) {
        e.fireT = 2.4 + RG(0, 0.7);
        eb(e.x, e.y, Math.atan2(dy, dx), 255, 5, '#ff6a3c');
        tone('square', 340, 180, 0.1, 0.05);
      }
    } else if (e.t === 'splitter') {
      e.vx = LP(e.vx, ux * e.sp, k); e.vy = LP(e.vy, uy * e.sp, k);
      e.rot += 2.2 * dt;
    } else if (e.t === 'minelayer') {
      e.vx = LP(e.vx, ux * e.sp, k); e.vy = LP(e.vy, uy * e.sp, k);
      e.rot += 0.6 * dt;
      e.fireT -= dt;
      if (e.fireT <= 0 && mines.length < 10) {
        e.fireT = 2.8 + RG(0, 0.8);
        mines.push({ x: e.x, y: e.y, t: 0, life: 7, r: 9 });
        tone('square', 240, 160, 0.12, 0.05);
      }
    } else if (e.t === 'orbiter') {
      e.orb += dt * 1.7 * e.dir;
      const gx = player.x + Math.cos(e.orb) * 175 - e.x;
      const gy = player.y + Math.sin(e.orb) * 175 - e.y;
      const gl = Math.sqrt(gx * gx + gy * gy) || 1;
      e.vx = LP(e.vx, gx / gl * e.sp, k); e.vy = LP(e.vy, gy / gl * e.sp, k);
      e.rot += 2.6 * dt;
    } else if (e.t === 'meteor') {
      e.rot += 1.6 * dt;
      if (Math.random() < dt * 20 * PF()) parts.push({ type: 0, x: e.x + R(-e.r * 0.4, e.r * 0.4), y: e.y + R(-e.r * 0.4, e.r * 0.4),

        ctx.fillStyle = c.u.c;

  } else if (G.state === 'wgate') {

    const nw = G.pendingWave;

    else if (nw % 6 === 0) { info = '♛ 精英突击 · 高风险高回报'; ic = '#ffe233'; }
    else if (nw % 3 === 0) { info = '☄ 陨石风暴 · 击碎或闪避'; ic = '#ff9a3c'; }
    ctx.shadowColor = '#3dff9e'; ctx.shadowBlur = 18;

    txt('WAVE ' + pad(G.wave, 2) + ' CLEAR · 深呼吸，下一波你说了算', cx, H * 0.40 + 28, 12, 'rgba(190,220,245,.75)', 'center', 600);

    ctx.globalAlpha = 1;
    txt('下一波 · WAVE ' + pad(nw, 2), cx, H * 0.462 + 11, 12, 'rgba(170,200,235,.8)', 'center', 700, true);
    txt(info, cx, H * 0.462 + 25, 13, ic, 'center', 800);
    for (const wb of wBtns()) {
      const hov = mouse.x >= wb.x && mouse.x <= wb.x + wb.w && mouse.y >= wb.y && mouse.y <= wb.y + wb.h;
      ctx.save();
      if (hov) {
        const mx2 = wb.x + wb.w / 2, my2 = wb.y + wb.h / 2;
        ctx.translate(mx2, my2); ctx.scale(1.05, 1.05); ctx.translate(-mx2, -my2);
      }
      ctx.fillStyle = COL.panelHi;
      ctx.strokeStyle = hov ? '#ffffff' : wb.c;
      ctx.lineWidth = hov ? 2.5 : 1.5;
      rr(wb.x, wb.y, wb.w, wb.h, 10);
      ctx.fill(); ctx.stroke();
      ctx.globalAlpha = 0.08; ctx.fillStyle = wb.c;
      rr(wb.x, wb.y, wb.w, wb.h, 10); ctx.fill();
      ctx.globalAlpha = 1;
      if (hov) { ctx.shadowColor = wb.c; ctx.shadowBlur = 22; rr(wb.x, wb.y, wb.w, wb.h, 10); ctx.stroke(); ctx.shadowBlur = 0; }

      wrapTxt(G.muts.map(k => { const mu = MUTATORS.find(m => m.k === k); const ex = evo(k); return mu ? (ex ? '✦' + mu.en + '：' + mu.ed : mu.n + '：' + mu.d) : ''; }).join('　'), cx, H * 0.705, W * 0.88, 12, '#ffe9b0');

    if (ups.length) {
      txt('—— 当前构筑 ——', cx, H * 0.78, 11, 'rgba(120,200,255,.6)', 'center', 700);
      wrapTxt(ups.map(u => u.n + ' ×' + G.up[u.k]).join('　'), cx, H * 0.825, W * 0.85, 12.5, '#cfe8ff');
    }
    txt('M 静音 · F 全屏', cx, H * 0.88, 11, 'rgba(140,170,210,.4)', 'center', 500);

    ctx.fillStyle = 'rgba(8,2,10,' + 0.7 * fa + ')';
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = fa;
    const g = (G.time * 7) % 1 < 0.15;
    const ox = g ? R(-3, 3) : 0, oy = g ? R(-2, 2) : 0;

    }

      // [DAILY2] 结算展示本机今日最佳与连续挑战天数（留存钩子）
      const tb = G.daily && G.daily.rows.length ? G.daily.rows[0].s : 0;
      const stk = G.dstat && G.dstat.streak > 0 ? G.dstat.streak : 0;
      if (tb > 0 || stk > 0) {
        const dy3 = Math.max(H * 0.378, spBottom + 9);
        txt('本机今日最佳 ' + pad(tb, 7) + (stk > 0 ? ' · 连续挑战 ' + stk + ' 天' : ''), cx, dy3, 11.5, 'rgba(150,230,200,.8)', 'center', 600, true);
        spBottom = dy3 + 6;
      }

      const ly2 = Math.max(H * 0.378, spBottom + 9);

      spBottom = ly2 + 6;
    }
    // [SHADOW1] 召唤昨日之影的对局：结算对比「今日得分 vs 昨日得分」
    if (G.shadowRun && G.shadowRef) {
      const dl = Math.floor(G.score) - G.shadowRef.sc;

      txt('👻 昨日之影 ' + pad(G.shadowRef.sc, 7) + ' → 今日 ' + pad(Math.floor(G.score), 7) +
        (dl > 0 ? ' (+' + dl + ')' : dl < 0 ? ' (' + dl + ')' : ' (持平)'), cx, sy2, 12, 'rgba(138,255,212,.9)', 'center', 700, true);
      spBottom = sy2 + 6;

      ctx.save();
      ctx.shadowColor = RK[G.rank] || RK.D; ctx.shadowBlur = 24;
      txt(G.rank || 'D', W / 2 + 218, H * 0.545, 58, RK[G.rank] || RK.D, 'center', 900, true);

      txt('RANK', W / 2 + 218, H * 0.545 - 44, 10, 'rgba(190,215,240,.5)', 'center', 700, true, 3);
      txt(RN[G.rank] || RN.D, W / 2 + 218, H * 0.545 + 42, 10, 'rgba(190,215,240,.75)', 'center', 700);

    }
    const rows = [
      ['最终得分', pad(Math.floor(G.dispScore), 7)],
      ['最高纪录', pad(G.hiscore, 7)],
      [G.mode === 'brb' ? '迎战场次' : '到达波次', G.mode === 'brb' ? '第 ' + pad(G.wave, 2) + ' 场' : 'WAVE ' + pad(G.wave, 2)],
      ['等级', 'LV ' + G.level],
      ['击杀数', String(G.kills)],
      ['最大连击', '×' + G.maxCombo],
      ['命中率', (G.shots ? Math.round(G.hits / G.shots * 100) : 0) + '%']
    ];
    if (G.mode === 'graze') rows.push(['擦弹数', String(G.grazes)]);
    if (G.won && (G.mode === 'classic' || G.mode === 'boss')) rows.splice(3, 0, ['通关用时', fmtTime(G.rt)]);

    if (G.mode === 'duel' && G.duelRun) {
      rows.splice(3, 0, ['对决种子', duelSeedText(G.duelRun.seed)], ['波次上限', G.duelRun.cap + ' 波' + (G.won ? ' · 已打满' : '')]);
    }
    let ry = compact ? Math.max(H * 0.34, spBottom + 12) : Math.max(H * 0.40, spBottom + 12);
    const rowH = compact ? Math.max(15, Math.min(19, (btnY - 96 - ry) / rows.length)) : 24;
    rows.forEach((rw, i) => {
      const ra = CL((G.over - 0.9 - i * 0.08) / 0.25, 0, 1);
      if (ra > 0) {
        ctx.globalAlpha = fa * ra;
        txt(rw[0], cx - 150, ry, compact ? 12.5 : 14, 'rgba(150,180,220,.85)', 'left', 500);
        txt(rw[1], cx + 150, ry, compact ? 14 : 15, '#eaf6ff', 'right', 700, true);
      }
      ry += rowH;
    });
    const rowEnd = ry;
    ctx.globalAlpha = fa;
    const p2 = 0.5 + 0.5 * Math.sin(G.time * 3);
    // 悬赏码 / 击杀链提示
    let hintY = Math.min(H * 0.78, btnY - 74);
    if (compact) hintY = Math.max(hintY, rowEnd + 8);
    let hintDrawn = false;
    if (G.mode === 'ghost' && G.won && G.chainCode) {
      const pn = G.ghost ? G.ghost.chain + 1 : 1;
      const p3 = 0.5 + 0.5 * Math.sin(G.time * 4);
      txt('☠ 新悬赏码已就绪 · 击杀链 #' + pn + ' · 按 B 复制，把你的残影传给下一位猎人', cx, hintY, 13,
        'rgba(138,255,212,' + (0.65 + 0.35 * p3) + ')', 'center', 700, true);
      hintDrawn = true;
    } else if (G.mode === 'duel' && G.duelRun) {
      const p3 = 0.5 + 0.5 * Math.sin(G.time * 4);
      txt('⚔ 成绩码已就绪 · 按 D 复制回贴给对手 · 双方各开对方成绩码即判胜负', cx, hintY, 13,
        'rgba(255,206,154,' + (0.65 + 0.35 * p3) + ')', 'center', 700, true);

      txt('☠ 按 B 生成残影悬赏码 · 把这局构筑变成别人必须面对的 BOSS', cx, hintY, 12, 'rgba(138,255,212,.75)', 'center', 600, true);

    txt('点击 或 按 R 重新出击 · PRESS R TO RETRY', cx, ctaY, compact ? 13 : 15, 'rgba(255,255,255,' + (0.45 + 0.55 * p2) + ')', 'center', 700);
    txt('按 C 复制战报 · 按 T 返回主界面', cx, ctaY + 24, 12, 'rgba(150,190,240,.75)', 'center', 600);

    for (const ob of overBtns()) {
      const hov = mouse.x >= ob.x && mouse.x <= ob.x + ob.w && mouse.y >= ob.y && mouse.y <= ob.y + ob.h;
      ctx.save();
      ctx.fillStyle = COL.panelHi;
      ctx.strokeStyle = hov ? '#ffffff' : ob.c;

      rr(ob.x, ob.y, ob.w, ob.h, 9);
      ctx.fill(); ctx.stroke();

      rr(ob.x, ob.y, ob.w, ob.h, 9); ctx.fill();
      ctx.globalAlpha = 1;
      if (hov) { ctx.shadowColor = ob.c; ctx.shadowBlur = 18; rr(ob.x, ob.y, ob.w, ob.h, 9); ctx.stroke(); ctx.shadowBlur = 0; }
      txt(ob.l, ob.x + ob.w / 2, ob.y + ob.h / 2, 12, '#f2fbff', 'center', 800);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }
}

/* ================= render ================= */
function render() {
  // [FIX-1] 每帧强制复位画布状态。此前若某一帧在 'lighter' 合成模式下抛异常，
  // 合成模式与 globalAlpha 会残留在 context 上，导致后面的清屏失效、画面逐帧叠加变纯白。
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.filter = 'none';
  ctx.setLineDash([]);
  ctx.shadowBlur = 0;
  ctx.shadowColor = 'transparent';
  ctx.fillStyle = '#05060f';
  ctx.fillRect(0, 0, W, H);
  drawNebula();
  const sx = (Math.random() * 2 - 1) * G.shake * CALM * CFG.shake;
  const sy = (Math.random() * 2 - 1) * G.shake * CALM * CFG.shake;
  ctx.save();
  try {
    ctx.translate(sx, sy);
    drawStars();
    drawGrid();
    drawMarks();
    drawMines();
    drawPickups();
    drawOrbs();
    ctx.globalCompositeOperation = 'lighter';
    drawEBullets();
    drawBullets();
    drawEnemies();
    drawBoss();
    drawGhosts();
    // [FIX-COS5] title 态（主菜单/指南/关于/设置/成就）不绘制玩家飞船：goTitle 清空实体但不重置船位，
    // 残留船体会叠印在指南/关于面板文字上（测试员 bug1 的飞船图标）；其余实体数组均已被 goTitle 清空
    if (G.state !== 'title') {
      if (G.shadowRun) drawShadowGhost();
      drawShip(player, PAL1);
      if (G.coop && player2.active) drawShip(player2, PAL2);
    }
    drawParts();
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    drawTexts();
  } finally {
    // [FIX-2] 无论中间是否抛异常，都恢复合成模式，绝不让 'lighter' 泄漏到下一帧
    ctx.restore();
  }
  drawSingularity();
  postFX();
  if (G.riftT > 0) {
    ctx.fillStyle = 'rgba(60,110,255,0.07)';
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 0.35 + 0.15 * Math.sin(G.time * 10);
    ctx.strokeStyle = '#4d8cff'; ctx.lineWidth = 3;
    ctx.strokeRect(2, 2, W - 4, H - 4);
    ctx.globalAlpha = 1;
  }
  if (G.abyss && (G.state === 'playing' || G.state === 'paused' || G.state === 'levelup' || G.state === 'wgate')) {
    // 深渊回廊：红色回廊边界脉动，提示当前处于升格波次
    const pa = 0.14 + 0.09 * Math.sin(G.time * 3.2);
    ctx.globalAlpha = pa;
    ctx.strokeStyle = '#ff3355'; ctx.lineWidth = 3;
    ctx.strokeRect(3, 3, W - 6, H - 6);
    ctx.globalAlpha = pa * 0.45;
    ctx.lineWidth = 10;
    ctx.strokeRect(7, 7, W - 14, H - 14);
    ctx.globalAlpha = 1;
  }
  if (G.state === 'playing' || G.state === 'paused' || G.state === 'levelup' || G.state === 'wgate') drawHUD();
  drawBanner();
  drawQToast();
  drawAchPop();
  drawReticle();
  if (G.flash > 0) {
    ctx.fillStyle = 'rgba(255,255,255,' + Math.min(0.85, G.flash * CALM) + ')';
    ctx.fillRect(0, 0, W, H);
  }
  drawOverlay();
  drawKillcam();
  if (G.fade > 0.005) {
    ctx.fillStyle = 'rgba(2,3,10,' + CL(G.fade, 0, 1) + ')';
    ctx.fillRect(0, 0, W, H);
  }
}

/* ================= input ================= */
const keys = new Set();
const mouse = { x: 400, y: 250, inside: false };
const joy = { id: null, sx: 0, sy: 0, dx: 0, dy: 0, used: false }; // used：本局是否已用过摇杆（提示行隐）

      if (Math.abs(px[i] - px[0]) > 10 || Math.abs(px[i + 1] - px[1]) > 10 || Math.abs(px[i + 2] - px[2]) > 10) { flat = false; break; }
    }
  } catch (e) { return; }
  wdBlank = flat ? wdBlank + 1 : 0;
  if (wdBlank < 3) return;
  wdBlank = 0; wdCool = 4;
  try {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    ctx.filter = 'none'; ctx.setLineDash([]); ctx.shadowBlur = 0; ctx.shadowColor = 'transparent';
  } catch (e) {}
  enemies.length = 0; ebullets.length = 0; bullets.length = 0; parts.length = 0; ghosts.length = 0;
  orbs.length = 0; texts.length = 0; marks.length = 0; mines.length = 0; pickups.length = 0;
  G.boss = null; G.banner = null; G.endSnap = null; autopsyCache = null;
  G.hitstop = 0; G.slow = 1; G.slowT = 0; G.sgT = 0; G.thornQ = null;
  G.flash = 0; G.chroma = 0; G.shake = 0;
  G.errStreak = 0; healTries = 0; healSkip = 0;
  if (G.state === 'playing') banner('画面已自动恢复', 'WATCHDOG RECOVER · 荣誉榜与进度不受影响', '#3dff9e', true);
  try { render(); } catch (e) {}
}, 1500);
// 残影悬赏：带 #bounty=<码> 打开页面 → 解析并注入残影 BOSS 战（击杀链沿用码内深度）
const bootGhost = parseHashBounty();
if (bootGhost) { G.ghost = bootGhost; G.tStage = 'ghost'; }
// 连战构建器：本地记忆上次编辑的菜单；带 #rush=<码> 打开则直接载入好友的自定义连战
loadRush();
const bootRush = parseHashRush();
if (bootRush) { G.rush = bootRush; G.rushInv = true; G.tStage = 'brb'; }
// 种子对决：本地对决史 / 昨日之影档案初始化（坏档自愈在各自的 sanitize 里）
loadDuels();
loadShadow();
// 带 #duel=<码> 打开 → 对决确认页；带 #duelres=<成绩码> 打开 → 与本机对决史判胜负
const bootDuel = parseHashDuel();
if (bootDuel) { G.duel = bootDuel; G.duelInv = true; loadDuels(); G.tStage = 'duel'; }
const bootDuelRes = parseHashDuelRes();
if (bootDuelRes) { G.duelRes = applyDuelRes(bootDuelRes); G.duel = { seed: bootDuelRes.seed, lv: bootDuelRes.lv, cap: bootDuelRes.cap }; G.duelInv = true; G.tStage = 'duelres'; }
window.addEventListener('hashchange', () => {
  if (G.state !== 'title') return;
  const gh2 = parseHashBounty();
  if (gh2) { G.ghost = gh2; G.tStage = 'ghost'; return; }
  const rh2 = parseHashRush();
  if (rh2) { G.rush = rh2; G.rushInv = true; G.rushShareMsg = ''; G.tStage = 'brb'; }
  const dl2 = parseHashDuel();
  if (dl2) { G.duel = dl2; G.duelInv = true; loadDuels(); G.tStage = 'duel'; return; }
  const dr2 = parseHashDuelRes();
  if (dr2) { G.duelRes = applyDuelRes(dr2); G.duel = { seed: dr2.seed, lv: dr2.lv, cap: dr2.cap }; G.duelInv = true; G.tStage = 'duelres'; }
});
// PWA 离线缓存：sw.js 是唯一附加文件，file:// 下不注册（双击即玩不受影响）
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => { try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {} });
}
schedule();
/* [NV-DBG] 只读自检钩子：验收脚本用（快照战场/升级序列、注入测试输入）。不参与任何游戏逻辑，
   生产路径零调用；只读写游戏已有状态，不触碰存档格式与悬赏码。 */
window.NV_SNAP = () => ({
  state: G.state, mode: G.mode, wave: G.wave, score: Math.floor(G.score), level: G.level,
  muts: G.muts.slice(), mutE: G.mutE.slice(), seed: RSTATE >>> 0, tier: G.tier, q: G.q,
  ebCap: EB_CAP, ftEma: Math.round(G.ftEma * 100) / 100,
  enemies: enemies.map(e => [e.t, e.elite ? 1 : 0, Math.round(e.x * 4) / 4, Math.round(e.y * 4) / 4, e.hp, e.maxhp, Math.round(e.sp * 100) / 100]),
  queue: G.waveQueue.slice(), marks: marks.map(m => [m.k, Math.round(m.x), Math.round(m.y)]),
  cards: (G.cards || []).map(c => c.u.k),
  boss: G.boss ? [G.boss.ki, G.boss.st, G.boss.hp, G.boss.maxhp] : null,
  dailyRank: G.dailyRank, dstat: G.dstat ? { streak: G.dstat.streak, best: G.dstat.best.s, mcombo: G.dstat.mcombo } : null,
  ach: G.ach.slice(), qToast: G.qToast ? G.qToast.msg : null, errStreak: G.errStreak,
  duelRun: G.duelRun ? { seed: G.duelRun.seed, cap: G.duelRun.cap, lv: G.duelRun.lv.slice() } : null,
  shadowRun: G.shadowRun, shadowOn: G.shadowOn, shadowRef: G.shadowRef ? { sc: G.shadowRef.sc, w: G.shadowRef.w, n: Math.floor(G.shadowRef.s.length / 3) } : null,
  shSampN: G.shSamp ? Math.floor(G.shSamp.length / 3) : 0,
  duels: (G.duels || []).map(d => ({ seed: d.seed, cap: d.cap, me: d.me ? d.me.s : null, opp: d.opp ? d.opp.s : null, res: d.res })),
  tStage: G.tStage,
  sgeom: G.tStage === 'set' ? setGeom() : null
});
window.NV_CHEAT = {
  xp: () => { G.xp = G.xpNeed; },              // 直接触发升级三选一（验证升级序列确定性）
  fps: f => { G.ftEma = 1000 / f; },           // 模拟帧率（验证画质档位降/升）
  lowNow: () => { G.tLow = 10.01; G.tHigh = 0; }, // 直接满足降档持时（跳过 10s 等待）
  highNow: () => { G.tHigh = 20.01; G.tLow = 0; }, // 直接满足回升持时
  kill: () => { G.lives = 1; hurtShip(player); }, // 测试专用速死走 recordScore（验证 dstat/成就/结算链路）
  tier: () => G.tier
};
})();
</script>
