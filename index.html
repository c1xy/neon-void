/* ================= canvas sizing ================= */
function resize() {
  const r = stage.getBoundingClientRect();
  if (r.width < 10 || r.height < 10) return;
  W = r.width; H = r.height;
  DPR = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  player.x = CL(player.x, 18, W - 18); player.y = CL(player.y, 18, H - 18);
  glowCv.width = Math.max(2, Math.round(cv.width / 4));
  glowCv.height = Math.max(2, Math.round(cv.height / 4));
  nebCv.width = Math.max(2, Math.round(W / 2));
  nebCv.height = Math.max(2, Math.round(H / 2));
  nebLast = -9;
  buildGrid();
}

/* ================= reactive grid & post fx ================= */
function buildGrid() {
  gridSp = W < 640 ? 40 : 48;
  gridCols = Math.ceil(W / gridSp) + 1;
  gridRows = Math.ceil(H / gridSp) + 1;
  gridPts = [];
  for (let r = 0; r < gridRows; r++) for (let c = 0; c < gridCols; c++) {
    const x = c * gridSp, y = r * gridSp;
    gridPts.push({ x, y, ax: x, ay: y, vx: 0, vy: 0, e: 0 });
  }
}
function gridPush(x, y, radius, force, dt) {
  const m = dt == null ? 1 : dt;
  const r2 = radius * radius;
  for (const p of gridPts) {
    const dx = p.x - x, dy = p.y - y, d2 = dx * dx + dy * dy;
    if (d2 < r2 && d2 > 0.01) {
      const d = Math.sqrt(d2);
      const f = (1 - d / radius) * force * m;
      p.vx += (dx / d) * f; p.vy += (dy / d) * f;
    }
  }
}
function updGrid(dt) {
  const damp = Math.exp(-2.4 * dt);
  for (const p of gridPts) {
    p.vx += (p.ax - p.x) * 64 * dt;
    p.vy += (p.ay - p.y) * 64 * dt;
    p.vx *= damp; p.vy *= damp;
    p.x += p.vx * dt; p.y += p.vy * dt;
    const ddx = p.x - p.ax, ddy = p.y - p.ay;
    const e = Math.min(1, Math.sqrt(ddx * ddx + ddy * ddy) / 26);
    if (e > p.e) p.e = e; else p.e *= Math.exp(-3 * dt);
  }
}
function postFX() {
  try {
    glowCtx.setTransform(1, 0, 0, 1, 0, 0);
    glowCtx.clearRect(0, 0, glowCv.width, glowCv.height);
    glowCtx.drawImage(cv, 0, 0, glowCv.width, glowCv.height);
    ctx.save();
    try {
    ctx.globalCompositeOperation = 'lighter';
    if (G.q >= 2) {
      ctx.filter = 'blur(10px)';
      ctx.globalAlpha = 0.55;
      ctx.drawImage(glowCv, 0, 0, W, H);
      ctx.filter = 'blur(3px)';
      ctx.globalAlpha = 0.4;
      ctx.drawImage(glowCv, 0, 0, W, H);
    } else if (G.q === 1) {
      ctx.filter = 'blur(6px)';
      ctx.globalAlpha = 0.6;
      ctx.drawImage(glowCv, 0, 0, W, H);
    }
    const chq = G.chroma * CALM;
    if (chq > 0.02) {
      const o = 3 + chq * 7;
      ctx.filter = 'blur(2px) saturate(2.4) hue-rotate(110deg)';
      ctx.globalAlpha = 0.45 * chq;
      ctx.drawImage(glowCv, -o, -o * 0.4, W, H);
      ctx.filter = 'blur(2px) saturate(2.4) hue-rotate(-110deg)';
      ctx.drawImage(glowCv, o, o * 0.4, W, H);
    }
    } finally {
      ctx.filter = 'none';
      ctx.restore();
    }
  } catch (e) {}
}
function drawNebula() {
  if (G.time - nebLast > 0.45) {
    nebLast = G.time;
    const nw = nebCv.width, nh = nebCv.height;
    nebCtx.setTransform(1, 0, 0, 1, 0, 0);
    nebCtx.clearRect(0, 0, nw, nh);
    const amb = nebCtx.createRadialGradient(nw / 2, nh / 2, 0, nw / 2, nh / 2, Math.max(nw, nh) * 0.7);
    amb.addColorStop(0, 'rgba(28,38,86,0.28)');
    amb.addColorStop(1, 'rgba(0,0,0,0)');
    nebCtx.fillStyle = amb;
    nebCtx.fillRect(0, 0, nw, nh);
    const t = G.time * 0.05;
    const mx = Math.max(nw, nh);
    const blobs = [
      [nw * (0.3 + 0.12 * Math.sin(t)), nh * (0.35 + 0.1 * Math.cos(t * 1.3)), mx * 0.55, 'rgba(40,60,160,0.10)'],
      [nw * (0.75 + 0.1 * Math.cos(t * 0.8)), nh * (0.7 + 0.12 * Math.sin(t * 1.1)), mx * 0.5, 'rgba(120,40,150,0.09)'],
      [nw * (0.55 + 0.15 * Math.sin(t * 0.6 + 2)), nh * (0.25 + 0.08 * Math.cos(t * 0.9 + 1)), mx * 0.42, 'rgba(20,120,140,0.08)']
    ];
    for (const b of blobs) {
      const g = nebCtx.createRadialGradient(b[0], b[1], 0, b[0], b[1], b[2]);
      g.addColorStop(0, b[3]);
      g.addColorStop(1, 'rgba(0,0,0,0)');
      nebCtx.fillStyle = g;
      nebCtx.fillRect(0, 0, nw, nh);
    }
  }
  ctx.drawImage(nebCv, 0, 0, W, H);
}

/* ================= audio ================= */
let AC = null, master = null, mgain = null, sgain = null, noiseBuf = null;
const MUS = { on: false, step: 0, next: 0, timer: null };
const SPB = 60 / 124 / 2; // 8分音符
const BASS = [0, 0, 12, 0, 3, 0, 10, 7, 0, 0, 12, 0, 3, 3, 5, 7];

function audioInit() {
  if (AC) return;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    const comp = AC.createDynamicsCompressor();
    comp.connect(AC.destination);
    master = AC.createGain(); master.gain.value = G.muted ? 0 : 1; master.connect(comp);
    mgain = AC.createGain(); mgain.connect(master);
    sgain = AC.createGain(); sgain.connect(master);
    applyCfg();
    startMusic();
  } catch (e) { AC = null; }
}
function env(g, t0, a, peak, dur) {
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(peak, t0 + a);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
}
function tone(type, f0, f1, dur, vol, t0, dest) {
  if (!AC || G.muted || CFG.mute || AC.state !== 'running') return;
  t0 = t0 || AC.currentTime;
  try {
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t0);
    if (f1) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t0 + dur);
    env(g, t0, 0.006, vol, dur);
    o.connect(g); g.connect(dest || sgain);
    o.start(t0); o.stop(t0 + dur + 0.06);
  } catch (e) {}
}
function makeNoiseBuf() {
  const len = AC.sampleRate;
  noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
}
function noise(dur, vol, fType, f0, f1, q) {
  if (!AC || G.muted || CFG.mute || AC.state !== 'running') return;
  try {
    if (!noiseBuf) makeNoiseBuf();
    const t0 = AC.currentTime;
    const s = AC.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
    const f = AC.createBiquadFilter(); f.type = fType || 'lowpass';
    f.frequency.setValueAtTime(f0 || 1000, t0);
    if (f1) f.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t0 + dur);
    f.Q.value = q || 0.8;
    const g = AC.createGain(); env(g, t0, 0.006, vol, dur);
    s.connect(f); f.connect(g); g.connect(sgain);
    s.start(t0); s.stop(t0 + dur + 0.06);
  } catch (e) {}
}
const sfxShoot   = () => tone('square', 720 + R(-60, 60), 190, 0.085, 0.042);
const sfxHit     = () => tone('triangle', 320, 150, 0.05, 0.05);
const sfxExplode = (r) => { noise(0.3 + r * 0.004, 0.45, 'lowpass', 1500, 120); tone('sine', 110, 38, 0.34, 0.5); };
const sfxPickup  = () => { tone('sine', 660, null, 0.09, 0.12); if (AC) tone('sine', 990, null, 0.13, 0.11, AC.currentTime + 0.07); };
const sfxMile    = (l) => tone('square', 420 * Math.pow(1.14, l), 640 * Math.pow(1.14, l), 0.16, 0.09);
const sfxHurt    = () => { tone('sawtooth', 300, 50, 0.5, 0.35); noise(0.42, 0.4, 'lowpass', 900, 90); };
const sfxDash    = () => noise(0.14, 0.16, 'highpass', 1100, 5000);
const sfxBomb    = () => { noise(0.9, 0.6, 'lowpass', 3200, 70); tone('sine', 72, 28, 0.8, 0.5); };
const sfxWave    = () => { tone('sine', 170, 60, 0.5, 0.28); tone('square', 520, 880, 0.16, 0.05); };
const sfxBoss    = () => { if (!AC) return; for (let i = 0; i < 4; i++) tone('sawtooth', i % 2 ? 460 : 300, null, 0.16, 0.12, AC.currentTime + i * 0.18); };
const sfxOver    = () => { tone('sawtooth', 220, 38, 1.2, 0.28); noise(1.1, 0.35, 'lowpass', 2200, 60); };
const uiClick    = () => tone('square', 700, null, 0.05, 0.05);
const sfxRift    = () => { tone('sawtooth', 320, 55, 0.7, 0.22); noise(0.6, 0.25, 'lowpass', 800, 90); };
const sfxOD      = () => { tone('sawtooth', 180, 760, 0.45, 0.2); tone('square', 900, 1400, 0.3, 0.06); };
const sfxLevel   = () => { if (!AC || G.muted) return; const t0 = AC.currentTime; [523, 659, 784, 1046].forEach((f, i) => tone('sine', f, null, 0.22, 0.14, t0 + i * 0.09)); };

function startMusic() {
  if (MUS.on || !AC) return;
  MUS.on = true; MUS.next = AC.currentTime + 0.15;
  MUS.timer = setInterval(musicTick, 90);
}
function musicTick() {
  if (!AC || AC.state !== 'running' || G.muted || CFG.mute) return;
  try {
    // [FIX-12] 切后台回来时 currentTime 已跳很远，补播会瞬间排几百个音符造成卡顿，直接对齐
    if (MUS.next < AC.currentTime - 0.5) MUS.next = AC.currentTime + 0.05;
    while (MUS.next < AC.currentTime + 0.32) {
      schedStep(MUS.step, MUS.next);
      MUS.step = (MUS.step + 1) % 32;
      MUS.next += SPB;
    }
  } catch (e) {}
}
function schedStep(s, t) {
  if (G.muted) return;
  bassNote(55 * Math.pow(2, BASS[s % 16] / 12), t, SPB * 0.92);
  if (s % 4 === 0) kick(t);
  if (s % 2 === 1) hat(t);
  if (s === 0) pad2(t, [0, 3, 7, 12]);
  if (s === 16) pad2(t, [-2, 2, 5, 12]);
}
function bassNote(f, t, dur) {
  const o = AC.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f;
  const flt = AC.createBiquadFilter(); flt.type = 'lowpass';
  flt.frequency.value = G.state === 'playing' ? 300 + Math.min(700, G.wave * 50) : 140;
  flt.Q.value = 3.5;
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(0.15, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(flt); flt.connect(g); g.connect(mgain);
  o.start(t); o.stop(t + dur + 0.05);
}
function kick(t) {
  const o = AC.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(130, t);
  o.frequency.exponentialRampToValueAtTime(42, t + 0.11);
  const g = AC.createGain();
  g.gain.setValueAtTime(0.3, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
  o.connect(g); g.connect(mgain); o.start(t); o.stop(t + 0.16);
}
function hat(t) {
  if (!noiseBuf) makeNoiseBuf();
  const s = AC.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
  const f = AC.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 7000;
  const g = AC.createGain();
  g.gain.setValueAtTime(0.045, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
  s.connect(f); f.connect(g); g.connect(mgain); s.start(t); s.stop(t + 0.06);
}
function pad2(t, semis) {
  const dur = SPB * 16;
  for (const s of semis) for (const det of [-5, 5]) {
    const o = AC.createOscillator(); o.type = 'sawtooth';
    o.frequency.value = 110 * Math.pow(2, s / 12); o.detune.value = det;
    const flt = AC.createBiquadFilter(); flt.type = 'lowpass'; flt.frequency.value = 720;
    const g = AC.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.016, t + dur * 0.3);
    g.gain.linearRampToValueAtTime(0.0001, t + dur);
    o.connect(flt); flt.connect(g); g.connect(mgain);
    o.start(t); o.stop(t + dur + 0.05);
  }
}

function startWave(n) {

  G.waveKind = (n % 5 !== 0 && n >= 3) ? (n % 6 === 0 ? 'elite' : n % 3 === 0 ? 'meteor' : 'n') : 'n';
  if (n % 5 === 0) {
    spawnBoss(n);
    G.waveQueue = [];

    for (let i = 0; i < cnt; i++) G.waveQueue.push('chaser');
    G.waveDelay = 3;
  } else if (G.waveKind === 'meteor') {
    banner('☄ 陨石风暴', 'METEOR STORM · 第 ' + n + ' 波 · 击碎或闪避', '#ff9a3c');
    tone('sawtooth', 95, 40, 0.7, 0.3);
    sfxWave();
    const cnt = 8 + Math.floor(n * 0.9);
    G.waveQueue = [];
    for (let i = 0; i < cnt; i++) G.waveQueue.push('meteor');
    G.waveDelay = 0.9;
  } else if (G.waveKind === 'elite') {
    banner('♛ 精英突击', 'ELITE ASSAULT · 第 ' + n + ' 波 · 高风险高回报', '#ffe233');
    sfxWave();
    let budget = 2 + n * 0.55;
    const pool = EKEYS.filter(k => ETYPES[k].minW <= n && k !== 'mini' && k !== 'meteor');
    const q = [];
    let guard = 0;
    while (budget > 0 && guard++ < 200) {
      let k = pool[RI(0, pool.length - 1)];
      if (ETYPES[k].cost * 1.6 > budget) k = 'chaser';
      q.push('E' + k); budget -= ETYPES[k].cost * 1.6;
    }
    G.waveQueue = q; G.waveDelay = 0.9;
  } else {
    banner('WAVE ' + pad(n, 2), '第 ' + n + ' 波');
    sfxWave();
    let budget = 4 + n * 2.4;
    // [FIX-13a] 24 波后不再硬性截断，改为缓慢增长（上限 90），保留后期压迫感
    if (budget > 60) budget = Math.min(90, 60 + (n - 24) * 1.2);
    if (hasMut('mag2')) budget *= evo('mag2') ? 1.15 : 1.4;
    const pool = EKEYS.filter(k => ETYPES[k].minW <= n && k !== 'mini' && k !== 'meteor');
    const q = [];
    let guard = 0;
    while (budget > 0 && guard++ < 200) {
      let k = pool[RI(0, pool.length - 1)];
      if (ETYPES[k].cost > budget) k = 'chaser';

  }
}

    const jl = Math.sqrt(joy.dx * joy.dx + joy.dy * joy.dy);
    if (jl > 12) { ix = joy.dx / jl; iy = joy.dy / jl; }
    else { ix = 0; iy = 0; }
    player.ix = ix; player.iy = iy;
  }
  if (player.dashT > 0) {
    player.dashT -= dt;
    player.vx = Math.cos(player.dashA) * 1250;
    player.vy = Math.sin(player.dashA) * 1250;
    ghosts.push({ x: player.x, y: player.y, a: player.a, life: 0.32, c: PAL1.ghost });

  player.x = CL(player.x + player.vx * dt, 16, W - 16);

function updEnemies(dt) {
  for (let i = enemies.length - 1; i >= 0; i--) {

    const dx = player.x - e.x, dy = player.y - e.y;
    const d = Math.sqrt(dx * dx + dy * dy) || 1;
    const ux = dx / d, uy = dy / d;
    e.hitT = Math.max(0, e.hitT - dt);

    e.age += dt;
    const k = 1 - Math.exp(-3.2 * dt);
    if (e.t === 'chaser' || e.t === 'mini') {
      e.vx = LP(e.vx, ux * e.sp, k); e.vy = LP(e.vy, uy * e.sp, k);
      e.rot = Math.atan2(e.vy, e.vx);
    } else if (e.t === 'weaver') {
      const s = Math.sin(e.ph * 4);
      let tx = ux - uy * s, ty = uy + ux * s;
      const tl = Math.sqrt(tx * tx + ty * ty) || 1;
      e.vx = LP(e.vx, tx / tl * e.sp, k); e.vy = LP(e.vy, ty / tl * e.sp, k);
      e.rot += 3.4 * dt;
    } else if (e.t === 'tank') {
      e.vx = LP(e.vx, ux * e.sp, k); e.vy = LP(e.vy, uy * e.sp, k);
      e.rot += 0.8 * dt;
    } else if (e.t === 'sniper') {
      let tx, ty;

/* ================= draw helpers ================= */
function poly(x, y, r, n, rot) {
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const a = rot + i / n * TAU;
    const px = x + Math.cos(a) * r, py = y + Math.sin(a) * r;
    if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py);
  }
  ctx.closePath();
}
function shipPath(s) {
  ctx.beginPath();
  ctx.moveTo(15 * s, 0);
  ctx.lineTo(-11 * s, 9.5 * s);
  ctx.lineTo(-6 * s, 0);
  ctx.lineTo(-11 * s, -9.5 * s);
  ctx.closePath();
}
function txt(s, x, y, size, color, align, weight, mono, spacing) {
  ctx.font = (weight || 400) + ' ' + size + 'px ' + (mono ? MONO : FONT);
  ctx.letterSpacing = (spacing || 0) + 'px';
  ctx.textAlign = align || 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = color;
  ctx.fillText(s, x, y);

}
function shipIcon(x, y, s, c) {

}
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function wrapTxt(s, cx, cy, maxW, size, col) {
  ctx.font = '500 ' + size + 'px ' + FONT;
  let line = '';
  const lines = [];
  for (const ch of s) {
    if (ctx.measureText(line + ch).width > maxW) { lines.push(line); line = ch; }
    else line += ch;

  if (line) lines.push(line);

}
function drawUpgradeIcon(k) {
  if (k === 'dmg') { poly(0, 0, 13, 3, -Math.PI / 2); ctx.stroke(); ctx.globalAlpha = 0.3; poly(0, 2, 9, 3, -Math.PI / 2); ctx.fill(); ctx.globalAlpha = 1; }
  else if (k === 'rate') { for (let i = 0; i < 3; i++) { poly(-10 + i * 10, 0, 6, 3, -Math.PI / 2); ctx.stroke(); } }
  else if (k === 'shot') { [-0.35, 0, 0.35].forEach(a => { ctx.beginPath(); ctx.moveTo(Math.cos(a) * -12, Math.sin(a) * -12); ctx.lineTo(Math.cos(a) * 12, Math.sin(a) * 12); ctx.stroke(); }); }
  else if (k === 'spd') { ctx.beginPath(); ctx.moveTo(-12, 8); ctx.lineTo(2, -2); ctx.lineTo(-4, -2); ctx.lineTo(12, -10); ctx.stroke(); }
  else if (k === 'mag') { ctx.beginPath(); ctx.arc(0, 0, 5, 0, TAU); ctx.stroke(); ctx.globalAlpha = 0.5; ctx.beginPath(); ctx.arc(0, 0, 11, 0, TAU); ctx.stroke(); ctx.globalAlpha = 1; }
  else if (k === 'armor') { ctx.beginPath(); ctx.moveTo(0, -12); ctx.lineTo(10, -6); ctx.lineTo(10, 4); ctx.lineTo(0, 12); ctx.lineTo(-10, 4); ctx.lineTo(-10, -6); ctx.closePath(); ctx.stroke(); }

/* ================= render ================= */
function render() {
  // [FIX-1] 每帧强制复位画布状态。此前若某一帧在 'lighter' 合成模式下抛异常，
  // 合成模式与 globalAlpha 会残留在 context 上，导致后面的清屏失效、画面逐帧叠加变纯白。
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.filter = 'none';
  ctx.setLineDash([]);
  ctx.shadowBlur = 0;
  ctx.shadowColor = 'transparent';
  ctx.fillStyle = '#05060f';
  ctx.fillRect(0, 0, W, H);
  drawNebula();
  const sx = (Math.random() * 2 - 1) * G.shake * CALM * CFG.shake;
  const sy = (Math.random() * 2 - 1) * G.shake * CALM * CFG.shake;
  ctx.save();
  try {
    ctx.translate(sx, sy);
    drawStars();
    drawGrid();
    drawMarks();
    drawMines();
    drawPickups();
    drawOrbs();
    ctx.globalCompositeOperation = 'lighter';
    drawEBullets();
    drawBullets();
    drawEnemies();
    drawBoss();
    drawGhosts();
    drawShip(player, PAL1);
    if (G.coop && player2.active) drawShip(player2, PAL2);
    drawParts();
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    drawTexts();
  } finally {
    // [FIX-2] 无论中间是否抛异常，都恢复合成模式，绝不让 'lighter' 泄漏到下一帧
    ctx.restore();
  }
  drawSingularity();
  postFX();
  if (G.riftT > 0) {
    ctx.fillStyle = 'rgba(60,110,255,0.07)';
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 0.35 + 0.15 * Math.sin(G.time * 10);
    ctx.strokeStyle = '#4d8cff'; ctx.lineWidth = 3;
    ctx.strokeRect(2, 2, W - 4, H - 4);
    ctx.globalAlpha = 1;
  }
  if (G.state === 'playing' || G.state === 'paused' || G.state === 'levelup' || G.state === 'wgate') drawHUD();
  drawBanner();
  drawAchPop();
  drawReticle();
  if (G.flash > 0) {
    ctx.fillStyle = 'rgba(255,255,255,' + Math.min(0.85, G.flash * CALM) + ')';
    ctx.fillRect(0, 0, W, H);
  }
  drawOverlay();
  drawKillcam();
  if (G.fade > 0.005) {
    ctx.fillStyle = 'rgba(2,3,10,' + CL(G.fade, 0, 1) + ')';
    ctx.fillRect(0, 0, W, H);
  }
}

function titleAct(a) {
  if (!a) return;
  if (a === 'back') { G.tStage = 'mode'; uiClick(); return; }
  if (a === 'ach') { G.tStage = 'ach'; uiClick(); return; }
  if (a === 'set') { G.tStage = 'set'; uiClick(); return; }
  if (a === 'credits') { G.tStage = 'credits'; uiClick(); return; }
  if (a === 'guide') { G.tStage = 'guide'; uiClick(); return; }
  if (a.slice(0, 3) === 'gp:') { G.gp = +a.slice(3); uiClick(); return; }
  if (a.slice(0, 4) === 'cfg:') {
    const p = a.split(':');
    CFG[p[1]] = +p[2];
    if (p[1] === 'mute') G.muted = +p[2] === 1;
    applyCfg(); saveCfg(); uiClick();
    return;
  }
  if (a.slice(0, 5) === 'mode:') { G.tSel = a.slice(5); G.tStage = 'players'; uiClick(); return; }
  uiClick();
  startGame(G.tSel, a === 'pcoop' ? 'coop' : 'solo');
}
function handleKey(code) {
  if (code === 'KeyM') {
    G.muted = !G.muted;
    CFG.mute = G.muted ? 1 : 0;
    saveCfg();
    if (master) master.gain.value = G.muted ? 0 : 1;
    addText(W / 2, H * 0.4, G.muted ? '静音 ON' : '静音 OFF', '#9fc6ff', 15);
    return;
  }
  if (code === 'KeyF') {
    try {
      if (!document.fullscreenElement && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
      else if (document.exitFullscreen) document.exitFullscreen();
    } catch (e) {}
    return;
  }
  if (code === 'Escape' && G.state === 'title' && G.tStage !== 'mode') { titleAct('back'); return; }
  if (code === 'KeyP' || code === 'Escape') {
    if (G.state === 'playing') setPause(true);
    else if (G.state === 'paused') setPause(false);
    return;
  }
  if (code === 'Space' && G.state === 'playing') { useBomb(); return; }
  if (code === 'KeyQ') { castRift(); return; }
  if (code === 'KeyE') { castOD(); return; }
  if (code === 'KeyX') { castUltra(); return; }
  if (G.mode === 'versus' && G.state === 'playing' && code.indexOf('Digit') === 0) {
    const VP = { Digit1: 'radial', Digit2: 'spread', Digit3: 'spiral', Digit4: 'aimed', Digit5: 'wall', Digit6: 'blink', Digit7: 'charge' };
    const pn = VP[code];
    const vb = G.boss;
    if (pn && vb && vb.dying == null && vb.st === 'idle' && vb.pcd <= 0) {
      setBossPattern(vb, pn);
      vb.pcd = 1.1;
      uiClick();
    }
    return;
  }
  if (G.state === 'levelup') {
    if (code === 'KeyR') { doReroll(); return; }
    if (code === 'Digit1') { pickCard(0); return; }
    if (code === 'Digit2') { pickCard(1); return; }
    if (code === 'Digit3') { pickCard(2); return; }
  }
  if (code === 'ShiftLeft' || code === 'ShiftRight') {
    if (code === 'ShiftRight' && G.coop && player2.active) tryDash(player2);
    else tryDash();
    return;
  }
  if (code === 'Enter' || code === 'KeyR') {
    if (G.state === 'over') startGame(G.mode, G.coop ? 'coop' : 'solo');
  }
  if (code === 'KeyT' && (G.state === 'paused' || G.state === 'wgate' || (G.state === 'over' && G.over > 0.7))) {
    goTitle();
    return;
  }
  if (G.state === 'wgate') {
    if (code === 'Enter' || code === 'Space' || code === 'NumpadEnter') { wgateAct('go'); return; }
    return;
  }
  if (code === 'KeyC' && G.state === 'over' && G.over > 0.7) {
    copyText(battleReport(), ok => addText(W / 2, H * 0.78, ok ? '✓ 战报已复制到剪贴板' : '复制失败，请手动截图', ok ? '#3dff9e' : '#ff6688', 15));
    uiClick();
    return;
  }
  if (G.state === 'title') {
    if (G.tStage === 'ach') {
      if (code === 'Backspace' || code === 'KeyA') { titleAct('back'); return; }
      return;
    }
    if (G.tStage === 'set') {
      if (code === 'Backspace' || code === 'KeyS') { titleAct('back'); return; }
      return;
    }
    if (G.tStage === 'credits') {
      if (code === 'Backspace' || code === 'KeyC') { titleAct('back'); return; }
      return;
    }
    if (G.tStage === 'guide') {
      if (code === 'Digit1') { titleAct('gp:0'); return; }
      if (code === 'Digit2') { titleAct('gp:1'); return; }
      if (code === 'Digit3') { titleAct('gp:2'); return; }
      if (code === 'Backspace' || code === 'KeyG') { titleAct('back'); return; }
      return;
    }
    if (G.tStage === 'mode') {
      if (code === 'Digit1') { titleAct('mode:classic'); return; }
      if (code === 'Digit2') { titleAct('mode:endless'); return; }
      if (code === 'Digit3') { titleAct('mode:boss'); return; }
      if (code === 'Digit4') { titleAct('mode:chaos'); return; }
      if (code === 'Digit5') { titleAct('mode:daily'); return; }
      if (code === 'Digit6') { titleAct('mode:versus'); return; }
      if (code === 'KeyA') { titleAct('ach'); return; }
      if (code === 'KeyG') { titleAct('guide'); return; }
      if (code === 'KeyS') { titleAct('set'); return; }
      if (code === 'KeyC') { titleAct('credits'); return; }
      if (code === 'Enter' || code === 'Space') { titleAct('mode:' + G.tSel); return; }
    } else {
      if (code === 'Digit1') { titleAct('psolo'); return; }
      if (code === 'Digit2') { titleAct('pcoop'); return; }
      if (code === 'Enter') { titleAct('psolo'); return; }
      if (code === 'Backspace') { titleAct('back'); return; }
    }
  }
}
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'ArrowDown' || e.code === 'ArrowLeft' || e.code === 'ArrowRight') e.preventDefault();
  if (e.repeat) return;
  keys.add(e.code);
  audioInit();
  handleKey(e.code);
});
window.addEventListener('keyup', (e) => keys.delete(e.code));
cv.addEventListener('pointermove', (e) => {
  const r = cv.getBoundingClientRect();
  const px = e.clientX - r.left, py = e.clientY - r.top;
  if (e.pointerType === 'touch') {
    if (joy.id === e.pointerId) {
      joy.dx = CL(px - joy.sx, -60, 60);
      joy.dy = CL(py - joy.sy, -60, 60);
    }
    return;
  }
  mouse.x = px; mouse.y = py; mouse.inside = true;
  G.lastMouse = G.time;
});
function endJoy(e) { if (joy.id === e.pointerId) { joy.id = null; joy.dx = 0; joy.dy = 0; } }
cv.addEventListener('pointerup', endJoy);
cv.addEventListener('pointercancel', endJoy);
cv.addEventListener('pointerleave', () => { mouse.inside = false; });
cv.addEventListener('pointerdown', (e) => {
  const r = cv.getBoundingClientRect();
  const px = e.clientX - r.left, py = e.clientY - r.top;
  audioInit();
  if (AC && AC.state === 'suspended') { try { AC.resume(); } catch (err) {} }
  if (e.pointerType === 'touch') {
    G.touchMode = true;
    if (G.state === 'title') {
      let act = null;
      for (const tb of titleBtns()) {
        if (px >= tb.x && px <= tb.x + tb.w && py >= tb.y && py <= tb.y + tb.h) act = tb.act;
      }
      titleAct(act);
      return;
    }
    if (G.state === 'wgate') {
      let act = null;
      for (const wb of wBtns()) {
        if (px >= wb.x && px <= wb.x + wb.w && py >= wb.y && py <= wb.y + wb.h) act = wb.k;
      }
      wgateAct(act || 'go');
      return;
    }
    if (G.state === 'over') { if (G.over > 0.6) startGame(G.mode, G.coop ? 'coop' : 'solo'); return; }
    if (G.state === 'paused') { setPause(false); return; }
    if (G.state === 'levelup') {
      if (G.rrBtn && px >= G.rrBtn.x && px <= G.rrBtn.x + G.rrBtn.w && py >= G.rrBtn.y && py <= G.rrBtn.y + G.rrBtn.h) { doReroll(); return; }
      for (let i = 0; i < G.cards.length; i++) {
        const c = G.cards[i];
        if (px >= c.x && px <= c.x + c.w && py >= c.y && py <= c.y + c.h) { pickCard(i); return; }
      }
      return;
    }
    for (const b of touchBtns()) {
      if (D2(px, py, b.x, b.y) < b.r * b.r * 1.7) {
        if (b.k === 'dash') tryDash();
        else if (b.k === 'bomb') useBomb();
        else if (b.k === 'rift') castRift();
        else if (b.k === 'od') castOD();
        else if (b.k === 'ultra') castUltra();
        return;
      }
    }
    if (px < W * 0.55) { joy.id = e.pointerId; joy.sx = px; joy.sy = py; joy.dx = 0; joy.dy = 0; }
    return;
  }
  mouse.x = px; mouse.y = py; mouse.inside = true;
  G.lastMouse = G.time;
  if (G.state === 'wgate') {
    let act = null;
    for (const wb of wBtns()) {
      if (px >= wb.x && px <= wb.x + wb.w && py >= wb.y && py <= wb.y + wb.h) act = wb.k;
    }
    wgateAct(act || 'go');
    return;
  }
  if (G.state === 'levelup') {
    if (G.rrBtn && mouse.x >= G.rrBtn.x && mouse.x <= G.rrBtn.x + G.rrBtn.w && mouse.y >= G.rrBtn.y && mouse.y <= G.rrBtn.y + G.rrBtn.h) { doReroll(); return; }
    for (let i = 0; i < G.cards.length; i++) {
      const c = G.cards[i];
      if (mouse.x >= c.x && mouse.x <= c.x + c.w && mouse.y >= c.y && mouse.y <= c.y + c.h) { pickCard(i); return; }
    }
    return;
  }
  if (G.state === 'title') {
    let act = null;
    for (const tb of titleBtns()) {
      if (px >= tb.x && px <= tb.x + tb.w && py >= tb.y && py <= tb.y + tb.h) act = tb.act;
    }
    titleAct(act);
    return;
  }
  if (G.state === 'over') { if (G.over > 0.6) startGame(G.mode, G.coop ? 'coop' : 'solo'); return; }
  if (G.state === 'paused') setPause(false);
});
cv.addEventListener('contextmenu', (e) => e.preventDefault());
window.addEventListener('blur', () => {
  if (G.state === 'playing') setPause(true);
  keys.clear();
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    if (G.state === 'playing') setPause(true);
    if (AC && AC.state === 'running') { try { AC.suspend(); } catch (e) {} }
  }
});

/* ================= main loop ================= */
let last = performance.now(), useTimeout = false, lastFrameAt = performance.now();
function schedule() { if (useTimeout) setTimeout(() => frame(performance.now()), 16); else requestAnimationFrame(frame); }
setInterval(() => { if (performance.now() - lastFrameAt > 400) useTimeout = true; }, 700);
function frame(now) {
  lastFrameAt = performance.now();
  cv.style.cursor = G.state === 'playing' ? 'none' : 'pointer';
  schedule();
  RDT = Math.min(0.05, (now - last) / 1000);
  last = now;
  G.ftEma = G.ftEma * 0.95 + RDT * 1000 * 0.05;
  G.qT += RDT;
  if (CFG.fx === 1) G.q = 2;
  else if (CFG.fx === 2) G.q = Math.min(G.q, 1);
  else if (G.qT > 2) {
    G.qT = 0;
    if (G.ftEma > 22 && G.q > 0) G.q--;
    else if (G.ftEma < 15 && G.q < 2) G.q++;
  }
  if (G.banner) { G.banner.t += RDT; if (G.banner.t >= G.banner.d) G.banner = null; }
  if (G.achPop) { G.achPop.t += RDT; if (G.achPop.t > 3.4) G.achPop = null; }
  if (G.state === 'over') G.over += RDT;
  if (G.state === 'over' && G.over > 3 && G.dispScore !== G.score) G.dispScore = G.score;
  if (G.state === 'levelup') G.cardT += RDT;
  G.time += RDT;
  // [FIX-14] 解锁过就不再每帧调用（原来 300 秒后每帧都进一次 unlock）
  if (G.state === 'playing') { G.rt += RDT; if (G.rt > 300 && G.ach.indexOf('survivor') < 0) unlock('survivor'); }
  // [FIX-7] 白幕保险丝：闪光持续超过 2.5 秒必为异常，强制归零
  if (G.flash > 0.25) { G.flashT = (G.flashT || 0) + RDT; if (G.flashT > 2.5) { G.flash = 0; G.flashT = 0; G.chroma = 0; } }
  else G.flashT = 0;
  try {
    if (G.hitstop > 0) { G.hitstop -= RDT; render(); return; }
    if (G.slowT > 0) { G.slowT -= RDT; if (G.slowT <= 0) G.slow = 1; }
    if (G.state === 'playing') update(RDT * G.slow);
    else if (G.state !== 'paused' && G.state !== 'levelup') updateAmbient(RDT);
    else decay(RDT); // [FIX-5] 暂停/升级时不更新世界，但闪光等特效必须继续衰减
    if (G.state === 'playing' && G.pending > 0) {
      G.state = 'levelup';
      rollCards();
      sfxLevel();
      G.flash = 0.35; G.chroma = Math.max(G.chroma, 0.7);
    }
    render();
    G.errStreak = 0;
  } catch (e) {
    // 自愈装甲：任何一帧出错都不冻结画面，连续出错则自动重置战场
    G.errStreak++;
    try { localStorage.setItem('nv_lasterr', String(e && e.message || e)); } catch (e2) {}
    G.flash = Math.max(0, G.flash - 0.15);
    G.shake = 0; G.chroma *= 0.85;
    G.hitstop = 0; G.slow = 1; G.slowT = 0; G.sgT = 0; G.thornQ = null;
    // [FIX-6] 先复位画布状态，否则 'lighter' 残留会让画布逐帧累加成纯白
    try {
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      ctx.filter = 'none';
      ctx.setLineDash([]);
      ctx.shadowBlur = 0;
      ctx.shadowColor = 'transparent';
    } catch (e0) {}
    if (G.errStreak === 20) {
      enemies.length = 0; ebullets.length = 0; mines.length = 0; marks.length = 0; G.boss = null; G.banner = null;
      bullets.length = 0; parts.length = 0; ghosts.length = 0; orbs.length = 0; texts.length = 0; // [FIX-6] 脏对象一并清掉
      banner('已自动恢复', 'AUTO RECOVERED · 战场已重置，继续战斗');
    }
    if (G.errStreak > 60) { goTitle(); G.errStreak = 0; return; }
    try { render(); } catch (e2) {
      try { ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.fillStyle = '#05060f'; ctx.fillRect(0, 0, W, H); } catch (e3) {}
    }
  }
}
resize();
if (typeof ResizeObserver !== 'undefined') new ResizeObserver(resize).observe(stage);
else window.addEventListener('resize', resize);
applyCfg();
schedule();
})();
</script>
